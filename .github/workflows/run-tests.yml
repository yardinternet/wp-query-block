name: Tests

on:
  pull_request:
    paths:
      - "**.php"
      - ".github/workflows/run-tests.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"
  workflow_dispatch:

jobs:
  test:
    uses: yardinternet/workflows/.github/workflows/run-laravel-testbench-tests.yml@main
    with:
      php-versions: '["8.2","8.3"]'
      laravel-versions: '["10.*","11.*","12.*"]'
    secrets: inherit
